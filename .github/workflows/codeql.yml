name: CodeQL

# Independent static-analysis scanning, not self-review — this repo has
# had 4 injection-class bugs (command injection, shell injection, path
# traversal — all fixed in 7bd1ad5/d282afa) found only by manual audit.
# Runs on every PR/push to main plus a weekly schedule so new code and
# already-merged code both get scanned on an ongoing basis.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1' # weekly, Monday 03:17 UTC

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
