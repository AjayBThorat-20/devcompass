name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-guard:
    # Catches the two failure modes behind the npm/GitHub version desync
    # this repo has hit before: bumping package.json to a version that's
    # already published (a no-op release nobody notices failed) or reusing
    # a version that already has a git tag (a duplicate release). Runs on
    # every PR/push to main, not just release commits, so it's a required
    # check rather than something that can be skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version isn't already published or tagged
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view devcompass version 2>/dev/null || echo "0.0.0")
          echo "package.json version: $PACKAGE_VERSION"
          echo "npm registry version:  $NPM_VERSION"

          if git rev-parse -q --verify "refs/tags/v$PACKAGE_VERSION" >/dev/null; then
            echo "::error::git tag v$PACKAGE_VERSION already exists — bump package.json to a new version."
            exit 1
          fi

          node -e "
            const semver = require('semver');
            const pkg = '$PACKAGE_VERSION';
            const published = '$NPM_VERSION';
            if (!semver.gt(pkg, published)) {
              console.error(\`::error::package.json version (\${pkg}) must be greater than the published npm version (\${published}).\`);
              process.exit(1);
            }
          "

  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite with coverage
        run: npm run test:coverage

      - name: Audit for known vulnerabilities
        run: npm audit --audit-level=high

  integration-smoke:
    runs-on: ubuntu-latest
    # The unit-test job above is fast and fully deterministic; this one drives
    # the real CLI (linked globally, same as an end user) against the 5 test
    # fixture projects in test/, hitting live OSV/npm-registry/GitHub APIs the
    # same way `devcompass analyze`/`fix`/`graph` do in production. That's
    # exactly the kind of integration bug unit tests can't catch (e.g. an OSV
    # response-shape assumption that's only wrong against the real API), but
    # it also means this job can fail for reasons that have nothing to do with
    # this repo's code — a transient GitHub/OSV rate limit or outage. It's
    # informational rather than a merge gate for that reason.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Link devcompass onto PATH (matches a real global install)
        run: npm link

      # test/project*-* are gitignored scratch fixtures (see .gitignore),
      # generated on demand rather than committed — a fresh CI checkout
      # doesn't have them until this runs.
      - name: Generate test fixture projects
        run: bash create-test-projects.sh

      - name: Install fixture project dependencies
        run: |
          for dir in test/project1-simple test/project2-vulnerable test/project3-outdated test/project4-complex test/project5-deprecated; do
            (cd "$dir" && npm install --no-audit --no-fund)
          done

      - name: Run integration smoke suite
        run: npm run test:integration
