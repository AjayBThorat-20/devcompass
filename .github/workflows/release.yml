name: Release

# Triggered by pushing a version tag (e.g. `git tag v4.1.7 && git push --tags`).
# Publishing to npm is gated behind the version-match assertion below, so a
# tag that doesn't match package.json's version can never publish — this is
# the automation that closes the gap the manual "tag it, then remember to
# also run `npm publish`" workflow left open.
#
# Publishing uses npm trusted publishing (OIDC) — no NPM_TOKEN secret needed.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Make sure npm supports trusted publishing (11.5.1+)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Publish to npm (no token; OIDC + provenance)
        run: npm publish

      - name: Create GitHub Release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" { found=1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
