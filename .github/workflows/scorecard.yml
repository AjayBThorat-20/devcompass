name: OpenSSF Scorecard

# A third-party, automatically-computed trust signal (supply-chain/security
# hygiene practices) as a check on this project's own self-reported claims —
# published to the OpenSSF Scorecard public dataset and exposable as a
# README badge once the first run completes.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 3' # weekly, Wednesday 04:23 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          sarif_file: results.sarif
